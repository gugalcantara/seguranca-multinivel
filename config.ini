; =============================================================================
; Parâmetros do sistema — APS PIVC 2026/2
; Princípio 10 do projeto: nenhum parâmetro fixo no código. Tudo aqui.
; Credenciais NÃO ficam aqui: ficam no .env (ver .env.exemplo).
; =============================================================================

[captura]
indice_camera = 0
largura = 640
altura = 480
; timeout (s) para ler um frame da fila antes de considerar a câmera parada
timeout_leitura = 2.0

[preprocessamento]
clahe_clip_limit = 2.0
clahe_grade = 8,8
; núcleo do filtro de redução de ruído (ímpar; 0 desliga)
ruido_kernel = 3
; dimensão normalizada da face (largura, altura)
dimensao_face = 200,200

[haar]
arquivo = haarcascade_frontalface_default.xml
arquivo_olhos = haarcascade_eye.xml
scale_factor = 1.1
min_neighbors = 5
min_size = 80,80

[rastreamento]
; Haar roda a cada N frames; KCF acompanha a ROI nos intermediários (D-02)
detectar_a_cada = 5

[lbph]
radius = 1
neighbors = 8
grid = 8,8

[qualidade]
; D-03 / RF-17 — calibrar com a base real; valores iniciais conservadores
nitidez_minima = 60.0
brilho_minimo = 50.0
brilho_maximo = 205.0
contraste_minimo = 25.0
ruido_maximo = 12.0
; diferença média mínima entre frames consecutivos aceitos (descarte de duplicata)
diferenca_minima_duplicata = 3.0

[limiares]
; LBPH devolve DISTÂNCIA: menor = mais parecido. Aceita se distancia <= limiar.
; >>> PROVISÓRIOS <<< — substituir pelos valores lidos da curva DET (ETP 7.1):
;   nivel_1 = EER; nivel_2 = ponto com FAR ~ 1%; nivel_3 = menor FAR alcançável.
nivel_1 = 70.0
nivel_2 = 60.0
nivel_3 = 50.0

[autenticacao]
; frames consecutivos coerentes exigidos antes de decidir (pós-processamento)
frames_confirmacao = 5
; tempo máximo (s) de tentativa facial antes de negar
timeout_face = 15
tentativas_senha = 3
bloqueio_minutos = 15
senha_forte_min_caracteres = 12
; regra dos dois (N3): janela (s) para a segunda pessoa se autenticar
janela_regra_dois = 120
; duração máxima (min) de uma sessão de nível 3
sessao_n3_minutos = 10

[vivacidade]
desafios = PISCAR,MOVER_ESQUERDA,MOVER_DIREITA
timeout = 8
; fração da largura da face que o centro precisa se deslocar
deslocamento_minimo = 0.35
; frames seguidos sem olhos detectados para contar como piscada
frames_olho_fechado = 2
; fração do recorte dos olhos que precisa estar DENTRO do quadro para o frame
; valer. Abaixo disso o frame é inconclusivo: rosto cortado faz o Haar devolver
; "nenhum olho" em silêncio, e sair de cena seria contado como piscada.
fracao_minima_rosto_visivel = 0.6

[cadastro]
frames_por_sessao = 40
frames_minimos_validos = 30
sessoes = 2
; Cadastro a partir de ARQUIVOS de imagem (alternativa à webcam). Exigir 30 fotos
; seria irreal; o mínimo abaixo vale por lote importado.
imagens_minimas = 5
; A matrícula é GERADA pelo sistema, não escolhida pela pessoa. Comprimento do
; código (ex.: R7K2M94). Sem I, O, 0 e 1: ela é digitada no login dos níveis 2 e 3.
tamanho_matricula = 7
; fotos de celular chegam com 3000+ px de largura; reduzir aproxima a escala da
; webcam, para a qual o Haar e o portão de qualidade foram parametrizados
largura_maxima_imagem = 1280

[tarja]
; gaussiano | pixelizacao | solido
metodo = gaussiano
kernel_gaussiano = 61
passadas_gaussiano = 3
bloco_pixelizacao = 16

[marca_dagua]
; lsb | dct
metodo_padrao = dct
forca_dct = 30.0
; coeficientes de média frequência comparados no bloco 8x8
coef_a = 2,3
coef_b = 3,2

[inspecao]
orb_features = 1500
razao_lowe = 0.75
correspondencias_minimas = 12
limiar_ssim = 0.90
limiar_diferenca = 40
area_minima = 150
kernel_morfologia = 5

[auditoria]
; dias que a foto de uma tentativa negada fica guardada antes de expirar
retencao_foto_negada_dias = 7

[experimentos]
semente = 2026
proporcao_teste = 0.30
far_alvo_nivel_2 = 0.01

[caminhos]
modelo = modelo/lbph.yml.enc
acervo = acervo/itens
acervo_metadados = acervo/itens/metadados.json
exportacoes = exportacoes
resultados = resultados
